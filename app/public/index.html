<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<title>ChickeX</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Baloo+2:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0c1410;--bg2:#0a110d;--panel:#15201a;--panel2:#1b271f;--line:#27362c;
  --txt:#eaf3ec;--dim:#93ab9b;--green:#4cd964;--green2:#2fb24e;--gold:#ffcf3f;--gold2:#e9b21f;
  --up:#33e08a;--down:#ff6357;--blue:#54b3f0;--ink:#0c1a12;
  --sky1:#7ec8f2;--sky2:#c6ecff;--grass1:#6fc44f;--grass2:#4d9c37;--barn:#cf5a4a;--wood:#7d5232;
  --r:18px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font-family:'Fredoka',system-ui,sans-serif;overflow:hidden}
#app{max-width:560px;margin:0 auto;height:100%;display:flex;flex-direction:column;position:relative;
  background:radial-gradient(800px 320px at 50% -120px,#163021 0%,transparent 62%),linear-gradient(var(--bg),var(--bg2))}
h1,h2,h3{font-family:'Baloo 2',sans-serif;margin:0}
.num{font-variant-numeric:tabular-nums}

/* ---------- HUD ---------- */
.hud{display:flex;align-items:center;gap:10px;padding:12px 14px 8px}
.av{width:40px;height:40px;border-radius:50%;background:linear-gradient(140deg,#ffd76b,#ff9e3d);display:grid;place-items:center;font-size:22px;border:2px solid #ffe39a;flex:none;box-shadow:0 4px 12px #0006}
.lvlwrap{flex:1;min-width:0}
.lvlrow{display:flex;align-items:baseline;gap:6px}
.lvl{font-family:'Baloo 2';font-weight:800;font-size:15px}.lvl b{color:var(--gold)}
.who{color:var(--dim);font-size:12px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.xp{height:7px;background:#0c1611;border:1px solid var(--line);border-radius:99px;margin-top:4px;overflow:hidden}
.xp>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#ffe27a,#ffb02e);transition:width .6s cubic-bezier(.2,.8,.2,1);box-shadow:0 0 10px #ffb02e88}
.bank{display:flex;flex-direction:column;gap:5px;align-items:flex-end}
.coinpill{display:flex;align-items:center;gap:6px;background:linear-gradient(180deg,#21301f,#172117);border:1px solid #3a5230;
  padding:6px 12px 6px 8px;border-radius:99px;font-family:'Baloo 2';font-weight:800;font-size:16px;box-shadow:inset 0 1px 0 #ffffff14}
.coinpill .c{width:20px;height:20px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe585,#f1ad17);border:1px solid #c98e10;display:grid;place-items:center;font-size:11px;color:#7a5505;font-weight:800}
.coinpill b{color:var(--gold)}
.mute{background:var(--panel);border:1px solid var(--line);color:var(--dim);width:30px;height:30px;border-radius:9px;font-size:14px;cursor:pointer}

/* ---------- tabs (bottom) ---------- */
.stage{flex:1;position:relative;overflow:hidden}
.view{position:absolute;inset:0;display:flex;flex-direction:column;opacity:0;pointer-events:none;transition:opacity .25s}
.view.on{opacity:1;pointer-events:auto}
.nav{display:flex;gap:8px;padding:8px 14px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(#0c141000,#0a110d 40%)}
.nav button{flex:1;background:var(--panel);border:1px solid var(--line);color:var(--dim);border-radius:14px;padding:9px 4px 7px;
  cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;font-family:'Baloo 2';font-weight:700;font-size:11px;transition:.15s}
.nav button .ic{font-size:19px}
.nav button.on{background:linear-gradient(180deg,#22331f,#18241a);color:var(--txt);border-color:var(--green2);box-shadow:0 6px 18px #0005, inset 0 1px 0 #ffffff12}

/* ---------- FARM ---------- */
.scene{flex:1;position:relative;margin:4px 12px 0;border-radius:22px;overflow:hidden;border:1px solid #20351f;
  box-shadow:0 16px 40px #0007, inset 0 0 0 1px #ffffff08;background:linear-gradient(var(--sky1),var(--sky2) 46%, #bfe6a0 47%, var(--grass1) 56%, var(--grass2))}
.sun{position:absolute;top:7%;left:14%;width:54px;height:54px;border-radius:50%;
  background:radial-gradient(circle at 50% 50%,#fff7c8,#ffe169 60%,#ffd23d);box-shadow:0 0 50px 14px #ffe16955;animation:sunpulse 5s ease-in-out infinite}
@keyframes sunpulse{50%{filter:brightness(1.12)}}
.cloud{position:absolute;font-size:34px;filter:drop-shadow(0 4px 3px #0002);opacity:.92}
.cloud.a{top:9%;animation:drift 38s linear infinite}.cloud.b{top:20%;font-size:26px;animation:drift 54s linear infinite;animation-delay:-20s}
@keyframes drift{from{left:-16%}to{left:116%}}
.hill{position:absolute;left:-5%;right:-5%;top:38%;height:18%;background:#7bbf57;border-radius:50%/100% 100% 0 0;filter:brightness(.96)}
.hill.b{top:41%;left:30%;right:-20%;background:#6fb84e}
.barn{position:absolute;right:7%;top:40%;width:84px;height:72px}
.tree{position:absolute;font-size:40px;filter:drop-shadow(0 6px 4px #0003)}
.pond{position:absolute;left:8%;bottom:9%;width:120px;height:40px;border-radius:50%;
  background:radial-gradient(circle at 40% 35%,#bfeefd,#6cc4e6 60%,#3f9fd0);box-shadow:inset 0 2px 6px #0003, 0 2px 0 #2b86b5}
.flower{position:absolute;font-size:15px;filter:drop-shadow(0 2px 1px #0002)}
.grasst{position:absolute;font-size:16px;opacity:.85}
.animals{position:absolute;inset:0}
.an{position:absolute;left:0;top:0;width:66px;height:62px;cursor:pointer;will-change:transform;z-index:1}
.an .flip{width:100%;height:100%;transition:transform .3s}
.an .spr{width:100%;height:100%;overflow:visible;animation:idle 2.4s ease-in-out infinite}
.an.walking .spr{animation:waddle .5s ease-in-out infinite}
@keyframes idle{50%{transform:translateY(-2px)}}
@keyframes waddle{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-3px) rotate(2deg)}}
.an .legL,.an .legR{transform-origin:top center}
.an.walking .legL{animation:legA .5s linear infinite}
.an.walking .legR{animation:legB .5s linear infinite}
@keyframes legA{0%,100%{transform:rotate(12deg)}50%{transform:rotate(-12deg)}}
@keyframes legB{0%,100%{transform:rotate(-12deg)}50%{transform:rotate(12deg)}}
.eye{animation:blink 4.2s infinite}
@keyframes blink{0%,96%,100%{transform:scaleY(1)}98%{transform:scaleY(.1)}}
.egg{position:absolute;top:-20px;left:50%;transform:translateX(-50%);cursor:pointer;animation:bobup 1.4s ease-in-out infinite;z-index:5}
.egg .b{width:26px;height:30px}
.egg .cnt{position:absolute;top:-6px;right:-8px;background:var(--gold);color:#5b3d00;font-family:'Baloo 2';font-weight:800;
  font-size:10px;border-radius:99px;padding:1px 5px;border:1.5px solid #fff;box-shadow:0 2px 4px #0005}
@keyframes bobup{50%{transform:translateX(-50%) translateY(-5px)}}
.hungry{position:absolute;top:-16px;left:50%;transform:translateX(-50%);font-size:15px;animation:bobup 1s infinite;z-index:5}
.fx{position:absolute;inset:0;pointer-events:none;z-index:30;overflow:hidden}
.part{position:absolute;font-size:18px;will-change:transform,opacity;animation:pop 900ms ease-out forwards}
@keyframes pop{0%{transform:translate(0,0) scale(.4);opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(1.2);opacity:0}}
.flt{position:absolute;font-family:'Baloo 2';font-weight:800;font-size:16px;text-shadow:0 2px 4px #000a;animation:flt 1100ms ease-out forwards;white-space:nowrap}
@keyframes flt{0%{transform:translateY(0) scale(.8);opacity:0}15%{opacity:1;transform:translateY(-6px) scale(1.1)}100%{transform:translateY(-48px) scale(1);opacity:0}}

.farmbar{display:flex;gap:10px;padding:10px 14px 2px}
.bigbtn{flex:1;border:none;border-radius:16px;padding:14px;cursor:pointer;font-family:'Baloo 2';font-weight:800;font-size:15px;
  display:flex;align-items:center;justify-content:center;gap:7px;box-shadow:0 6px 0 #0003,0 10px 20px #0004;transition:transform .08s, box-shadow .08s}
.bigbtn:active{transform:translateY(4px);box-shadow:0 2px 0 #0003}
.bigbtn .ic{font-size:18px}
.b-feed{background:linear-gradient(180deg,#5ad06f,#2faa4c);color:#06270f;box-shadow:0 6px 0 #1d6e30,0 12px 22px #0005}
.b-feed:active{box-shadow:0 2px 0 #1d6e30}
.b-collect{background:linear-gradient(180deg,#ffd75e,#f1ab1c);color:#5a3c00;box-shadow:0 6px 0 #b67e10,0 12px 22px #0005}
.b-collect:active{box-shadow:0 2px 0 #b67e10}
.invrow{display:flex;gap:8px;padding:10px 14px 2px;justify-content:center;flex-wrap:wrap}
.invchip{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px 12px;font-weight:700;font-size:13px;display:flex;gap:6px;align-items:center}
.invchip b{font-family:'Baloo 2';color:var(--gold)}

/* ---------- MARKET ---------- */
.mscroll{flex:1;overflow-y:auto;padding:6px 12px 4px}
.newsbar{display:flex;gap:8px;align-items:center;background:#10180f;border:1px solid var(--line);border-radius:12px;padding:8px 10px;overflow:hidden;margin-bottom:10px}
.newsbar .tag{background:var(--down);color:#fff;font-family:'Baloo 2';font-weight:800;font-size:10px;padding:2px 7px;border-radius:6px;flex:none}
.newsbar .scroll{white-space:nowrap;overflow:hidden;flex:1}
.newsbar .scroll span{display:inline-block;font-size:12.5px;color:var(--dim);padding-right:40px;animation:marq 26s linear infinite}
@keyframes marq{from{transform:translateX(0)}to{transform:translateX(-50%)}}
. tick{}
.ticks{display:flex;gap:9px;overflow-x:auto;padding-bottom:6px;margin-bottom:8px}
.tk{flex:0 0 auto;width:128px;background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:14px;padding:10px;cursor:pointer;position:relative;overflow:hidden;transition:.15s}
.tk.on{border-color:var(--green2);box-shadow:0 0 0 1px var(--green2),0 8px 20px #0005}
.tk .top{display:flex;align-items:center;gap:6px}
.tk .sp{width:26px;height:26px}.tk .sym{font-family:'Baloo 2';font-weight:800;font-size:14px}
.tk .px{font-family:'Baloo 2';font-weight:800;font-size:17px;margin-top:6px}
.tk .chg{font-size:12px;font-weight:700}
.tk .spark{position:absolute;right:6px;bottom:6px;width:54px;height:24px;opacity:.85}
.up{color:var(--up)}.down{color:var(--down)}
.chartcard{background:linear-gradient(180deg,#0e1712,#0b110d);border:1px solid var(--line);border-radius:18px;padding:12px;margin-bottom:10px}
.chead{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px}
.chead .nm{font-family:'Baloo 2';font-weight:800;font-size:17px;display:flex;align-items:center;gap:8px}
.chead .nm .sp{width:30px;height:30px}
.chead .pr{text-align:right}
.chead .pr .big{font-family:'Baloo 2';font-weight:800;font-size:22px}
.chead .pr .pill{font-size:12px;font-weight:700;padding:2px 8px;border-radius:99px;display:inline-block;margin-top:2px}
.pill.u{background:#10351f;color:var(--up)}.pill.d{background:#3a1714;color:var(--down)}
#chart{width:100%;height:172px;display:block}
.cols{display:flex;gap:10px}
.book{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px;font-size:11.5px;font-variant-numeric:tabular-nums}
.book .row{display:flex;justify-content:space-between;padding:2.5px 5px;position:relative;border-radius:5px}
.book .d{position:absolute;top:0;bottom:0;right:0;border-radius:5px;opacity:.15}
.book .ask{color:var(--down)}.book .bid{color:var(--up)}
.book .ask .d{background:var(--down)}.book .bid .d{background:var(--up)}
.book .px,.book .q{position:relative;z-index:1}
.book .mid{text-align:center;color:var(--dim);font-weight:800;padding:5px 0;font-family:'Baloo 2'}
.ticket{flex:1.15;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px}
.seg{display:flex;background:#0d1510;border:1px solid var(--line);border-radius:11px;padding:3px;margin-bottom:9px}
.seg button{flex:1;background:transparent;border:none;color:var(--dim);font-family:'Baloo 2';font-weight:700;padding:7px;border-radius:8px;cursor:pointer;font-size:12.5px}
.seg button.on{background:var(--panel2);color:var(--txt)}
.stepper{display:flex;align-items:center;gap:8px;margin-bottom:9px}
.stepper button{width:38px;height:40px;border:1px solid var(--line);background:var(--panel2);color:var(--txt);border-radius:10px;font-size:20px;font-weight:800;cursor:pointer}
.stepper input{flex:1;background:#0d1510;border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:10px;text-align:center;font-family:'Baloo 2';font-weight:800;font-size:16px;width:100%}
#priceRow{margin-bottom:9px;display:none}
#priceRow input{width:100%;background:#0d1510;border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:10px;text-align:center;font-family:'Baloo 2';font-weight:700}
.est{color:var(--dim);font-size:12px;text-align:center;margin:6px 0 9px}.est b{color:var(--txt)}
.bs{display:flex;gap:8px}
.bs button{flex:1;border:none;border-radius:13px;padding:13px;font-family:'Baloo 2';font-weight:800;font-size:16px;cursor:pointer;box-shadow:0 5px 0 #0004;transition:transform .08s,box-shadow .08s}
.bs button:active{transform:translateY(3px);box-shadow:0 2px 0 #0004}
.b-buy{background:linear-gradient(180deg,#3ee892,#1fbf6c);color:#053018;box-shadow:0 5px 0 #137d45}
.b-sell{background:linear-gradient(180deg,#ff7064,#e54637);color:#330704;box-shadow:0 5px 0 #9c2a20}
.pos{display:flex;justify-content:space-between;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:9px 12px;margin-top:10px;font-size:12.5px}
.pos b{font-family:'Baloo 2'}
.openord{margin-top:8px}
.openord .o{display:flex;justify-content:space-between;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 10px;margin-top:5px;font-size:12px}
.openord .o button{background:transparent;border:1px solid var(--line);color:var(--dim);border-radius:7px;padding:3px 9px;cursor:pointer;font-size:11px}
.tape{margin-top:10px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px;font-size:11.5px;font-variant-numeric:tabular-nums;max-height:120px;overflow:auto}
.tape .t{display:flex;justify-content:space-between;padding:2px 5px}

/* ---------- toast ---------- */
.toast{position:fixed;left:50%;top:14px;transform:translateX(-50%) translateY(-8px);background:#0d150f;border:1px solid var(--green2);
  color:var(--txt);padding:10px 18px;border-radius:99px;font-family:'Baloo 2';font-weight:700;font-size:13.5px;opacity:0;transition:.25s;pointer-events:none;z-index:60;box-shadow:0 8px 24px #0008}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}.toast.err{border-color:var(--down)}

/* ---------- onboarding ---------- */
.coach{position:absolute;inset:0;background:#0a110dcc;backdrop-filter:blur(3px);z-index:80;display:flex;align-items:center;justify-content:center;padding:26px;text-align:center}
.coach .card{background:linear-gradient(180deg,#1a261c,#141d16);border:1px solid var(--green2);border-radius:22px;padding:24px 22px;max-width:330px;box-shadow:0 20px 50px #000a}
.coach h2{font-size:24px;margin-bottom:6px}.coach h2 span{color:var(--gold)}
.coach p{color:var(--dim);font-size:14px;line-height:1.5;margin:6px 0 16px}
.coach .go{width:100%;border:none;border-radius:14px;padding:14px;font-family:'Baloo 2';font-weight:800;font-size:16px;cursor:pointer;
  background:linear-gradient(180deg,#5ad06f,#2faa4c);color:#06270f;box-shadow:0 5px 0 #1d6e30}
.coach .go:active{transform:translateY(3px);box-shadow:0 2px 0 #1d6e30}
</style>
</head>
<body>
<!-- shared SVG defs -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <linearGradient id="gW" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#e6e9ee"/></linearGradient>
  <linearGradient id="gY" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe680"/><stop offset="1" stop-color="#ffc23c"/></linearGradient>
  <linearGradient id="gBr" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c98a55"/><stop offset="1" stop-color="#9c6536"/></linearGradient>
  <linearGradient id="gGy" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eef0f2"/><stop offset="1" stop-color="#c4cad0"/></linearGradient>
  <linearGradient id="gEgg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fffaf0"/><stop offset="1" stop-color="#ffe6b8"/></linearGradient>
  <radialGradient id="gChart" cx="0.5" cy="0" r="1"><stop offset="0" stop-color="#33e08a55"/><stop offset="1" stop-color="#33e08a00"/></radialGradient>
</defs></svg>

<div id="app">
  <div class="hud">
    <div class="av" id="av">🧑‍🌾</div>
    <div class="lvlwrap">
      <div class="lvlrow"><div class="lvl">Lvl <b id="lvl">1</b></div><div class="who" id="who">Farmer</div></div>
      <div class="xp"><i id="xpbar" style="width:8%"></i></div>
    </div>
    <div class="bank">
      <div class="coinpill"><span class="c">$</span><b id="bal" class="num">0</b></div>
    </div>
    <button class="mute" id="mute" onclick="toggleMute()">🔊</button>
  </div>

  <div class="stage">
    <!-- FARM -->
    <div id="vFarm" class="view on">
      <div class="scene" id="scene">
        <div class="sun"></div>
        <div class="cloud a">☁️</div><div class="cloud b">☁️</div>
        <div class="hill"></div><div class="hill b"></div>
        <svg class="barn" viewBox="0 0 100 90"><polygon points="50,4 6,34 94,34" fill="#b14a3c"/><polygon points="50,12 16,34 84,34" fill="#cf5a4a"/><rect x="14" y="34" width="72" height="52" fill="#cf5a4a"/><rect x="14" y="34" width="72" height="52" fill="none" stroke="#9c4034" stroke-width="2"/><rect x="38" y="50" width="24" height="36" fill="#7d3a2f"/><path d="M38 50 L62 86 M62 50 L38 86" stroke="#b14a3c" stroke-width="2"/><rect x="20" y="40" width="14" height="12" fill="#ffe9a8"/><rect x="66" y="40" width="14" height="12" fill="#ffe9a8"/></svg>
        <div class="tree" style="left:2%;top:34%">🌳</div>
        <div class="pond"></div>
        <div class="flower" style="left:22%;bottom:18%">🌼</div><div class="flower" style="left:62%;bottom:12%">🌷</div>
        <div class="flower" style="left:78%;bottom:22%">🌻</div><div class="flower" style="left:40%;bottom:9%">🌸</div>
        <div class="grasst" style="left:30%;bottom:30%">🌿</div><div class="grasst" style="left:55%;bottom:26%">🌿</div><div class="grasst" style="left:84%;bottom:14%">🌱</div>
        <div class="animals" id="animals"></div>
        <div class="fx" id="fx"></div>
      </div>
      <div class="invrow" id="invrow"></div>
      <div class="farmbar">
        <button class="bigbtn b-feed" id="feedAll"><span class="ic">🌾</span> Feed all</button>
        <button class="bigbtn b-collect" id="collectAll"><span class="ic">🥚</span> Collect all</button>
      </div>
    </div>

    <!-- MARKET -->
    <div id="vMarket" class="view">
      <div class="mscroll">
        <div class="newsbar"><span class="tag">LIVE</span><div class="scroll"><span id="newsScroll">Market is calm…</span></div></div>
        <div class="ticks" id="ticks"></div>
        <div class="chartcard">
          <div class="chead">
            <div class="nm" id="cNm">—</div>
            <div class="pr"><div class="big num" id="cPr">—</div><div class="pill u" id="cChg">+0.00%</div></div>
          </div>
          <svg id="chart" viewBox="0 0 320 172" preserveAspectRatio="none"></svg>
        </div>
        <div class="cols">
          <div class="book" id="book"></div>
          <div class="ticket">
            <div class="seg"><button id="segM" class="on" onclick="setOType('market')">Market</button><button id="segL" onclick="setOType('limit')">Limit</button></div>
            <div class="stepper"><button onclick="bump(-1)">−</button><input id="qty" type="number" value="1" min="1"/><button onclick="bump(1)">+</button></div>
            <div id="priceRow"><input id="price" type="number" step="0.01" placeholder="Limit price"/></div>
            <div class="est" id="est">—</div>
            <div class="bs"><button class="b-buy" onclick="order('buy')">BUY</button><button class="b-sell" onclick="order('sell')">SELL</button></div>
            <div class="pos" id="pos"></div>
            <div class="openord" id="openord"></div>
          </div>
        </div>
        <div class="tape" id="tape"></div>
      </div>
    </div>
  </div>

  <div class="nav">
    <button id="navFarm" class="on" onclick="setTab('farm')"><span class="ic">🌾</span>Farm</button>
    <button id="navMkt" onclick="setTab('market')"><span class="ic">📈</span>Market</button>
  </div>

  <div class="coach" id="coach" style="display:none">
    <div class="card">
      <h2>Welcome to <span>ChickeX</span> 🐔</h2>
      <p>Raise livestock, collect their produce, and trade it on a live market where prices rise & fall. Grow your farm into an empire.</p>
      <button class="go" onclick="closeCoach()">Start farming →</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const tg=window.Telegram?.WebApp;try{tg?.ready();tg?.expand();tg?.setHeaderColor?.('#0c1410');}catch(e){}
const uid=(tg?.initDataUnsafe?.user?.id?'tg'+tg.initDataUnsafe.user.id:'dev');
const who=(tg?.initDataUnsafe?.user?.first_name||'Farmer');
const Q='?uid='+uid+'&name='+encodeURIComponent(who);
document.getElementById('who').textContent=who;
let TAB='farm',SEL='HEN',OTYPE='market',busy=false,muted=false,displayBal=0;
let FARM={animals:[],inventory:[]},MKT={list:[]},DET=null,NEWS=[];
const els=new Map();

/* ---------------- SVG sprites ---------------- */
const EYE='<g class="eye"><circle cx="0" cy="0" r="4.4" fill="#23303a"/><circle cx="1.4" cy="-1.4" r="1.5" fill="#fff"/></g>';
function legs(x1,x2,y,color){return `<g class="legR"><rect x="${x1}" y="${y}" width="4" height="15" rx="2" fill="${color}"/></g><g class="legL"><rect x="${x2}" y="${y}" width="4" height="15" rx="2" fill="${color}"/></g>`;}
function hen(body,big){const s=big?1:1;return `<svg class="spr" viewBox="0 0 120 116">
  <ellipse cx="60" cy="108" rx="30" ry="6" fill="#00000028"/>
  ${legs(50,66,84,'#f5a623')}
  <path d="M30 64 q-20 -6 -26 8 q14 4 26 -2z" fill="${body}"/>
  <path d="M30 56 q-16 -10 -24 -2 q12 2 24 8z" fill="${body}" opacity=".85"/>
  <ellipse cx="62" cy="60" rx="34" ry="31" fill="${body}"/>
  <path d="M62 34 q30 6 30 28 q0 18 -16 24 q14 -16 6 -34 q-6 -14 -20 -18z" fill="#00000012"/>
  <circle cx="80" cy="44" r="19" fill="${body}"/>
  <path d="M74 27 q3 -8 8 -3 q3 -7 8 -1 q4 -5 7 2 q5 0 2 8 q-12 -7 -25 -6z" fill="#e6483b"/>
  <path d="M86 60 q2 8 -3 11 q-4 -2 -2 -10z" fill="#e6483b"/>
  <path d="M97 46 l16 4 l-16 5z" fill="#f5a623"/>
  <g transform="translate(84,42)">${EYE}</g>
</svg>`;}
function chick(){return `<svg class="spr" viewBox="0 0 120 116">
  <ellipse cx="60" cy="108" rx="20" ry="5" fill="#00000028"/>
  ${legs(54,62,88,'#f5a623')}
  <ellipse cx="60" cy="74" rx="26" ry="24" fill="url(#gY)"/>
  <circle cx="60" cy="48" r="20" fill="url(#gY)"/>
  <path d="M36 70 q-12 -2 -16 6 q10 2 16 -2z" fill="#ffd24d"/>
  <path d="M58 48 l-14 3 l14 4z" fill="#f5a623" transform="rotate(0)"/>
  <path d="M62 46 l16 3 l-16 4z" fill="#f5a623"/>
  <path d="M54 30 q4 -8 8 0z" fill="#ffb02e"/>
  <g transform="translate(66,44)">${EYE}</g><g transform="translate(52,44)">${EYE}</g>
</svg>`;}
function rooster(){return `<svg class="spr" viewBox="0 0 120 116">
  <ellipse cx="60" cy="108" rx="30" ry="6" fill="#00000028"/>
  ${legs(50,66,84,'#f5a623')}
  <path d="M28 62 q-26 -22 -22 -44 q16 8 20 24 q10 -14 22 -10 q-12 8 -8 24z" fill="#1f8f5e"/>
  <path d="M30 58 q-20 -14 -28 -34 q14 4 22 18 q4 -8 14 -8 q-10 8 -6 22z" fill="#2bb277" opacity=".9"/>
  <ellipse cx="64" cy="60" rx="33" ry="30" fill="url(#gBr)"/>
  <path d="M64 36 q26 6 26 26 q0 16 -14 22 q12 -14 5 -30 q-6 -12 -17 -16z" fill="#00000018"/>
  <circle cx="82" cy="42" r="18" fill="#b3653a"/>
  <path d="M74 22 q3 -10 9 -3 q4 -9 9 -1 q5 -6 8 3 q6 1 2 10 q-15 -10 -28 -8z" fill="#e6483b"/>
  <path d="M88 58 q3 10 -3 14 q-5 -3 -2 -13z" fill="#e6483b"/>
  <path d="M99 44 l17 4 l-17 5z" fill="#f5a623"/>
  <g transform="translate(86,40)">${EYE}</g>
</svg>`;}
function duck(young){const b=young?'url(#gY)':'url(#gW)';return `<svg class="spr" viewBox="0 0 120 116">
  <ellipse cx="60" cy="108" rx="28" ry="6" fill="#00000028"/>
  ${legs(52,64,86,'#ff8c2b')}
  <path d="M28 66 q-22 -2 -28 10 q16 4 28 -3z" fill="${b}"/>
  <ellipse cx="58" cy="64" rx="34" ry="26" fill="${b}"/>
  <path d="M58 40 q26 4 26 22 q0 14 -14 20 q12 -14 4 -28 q-5 -10 -16 -14z" fill="#00000012"/>
  <circle cx="84" cy="42" r="17" fill="${b}"/>
  <path d="M97 40 q22 -2 22 6 q0 7 -22 6 q-6 -1 -6 -6 q0 -5 6 -6z" fill="#ff9e2c"/>
  <g transform="translate(86,40)">${EYE}</g>
</svg>`;}
function goat(young){const sc=young?0.8:1;return `<svg class="spr" viewBox="0 0 120 116">
  <ellipse cx="60" cy="108" rx="30" ry="6" fill="#00000028"/>
  <g transform="translate(60,${young?18:8}) scale(${sc}) translate(-60,-8)">
  ${legs(40,52,82,'#cfd3d8')}${legs(70,82,82,'#bcc1c7')}
  <ellipse cx="58" cy="62" rx="36" ry="24" fill="url(#gGy)"/>
  <path d="M58 40 q30 2 30 22 q0 16 -16 20 q14 -14 6 -28 q-6 -10 -20 -14z" fill="#00000010"/>
  <ellipse cx="92" cy="50" rx="15" ry="13" fill="#e9ecef"/>
  <path d="M86 40 q-6 -14 -2 -20 q6 8 8 18z" fill="#b9bec4"/>
  <path d="M98 40 q4 -14 10 -16 q-2 10 -6 18z" fill="#b9bec4"/>
  <path d="M80 52 q-10 2 -10 -3 q3 -2 10 0z" fill="#cfd3d8"/>
  <path d="M92 60 q1 9 -3 12 q-4 -3 -1 -12z" fill="#e9ecef"/>
  <g transform="translate(96,48)">${EYE}</g>
  </g>
</svg>`;}
function spriteFor(sp,stage){
  if(sp==='HEN')return stage==='young'?chick():hen('url(#gW)');
  if(sp==='ROOSTER')return stage==='young'?chick():rooster();
  if(sp==='DUCK')return duck(stage==='young');
  if(sp==='GOAT')return goat(stage==='young');
  return hen('url(#gW)');
}
function eggSVG(milk){return milk
  ? '<svg class="b" viewBox="0 0 30 34"><rect x="6" y="6" width="18" height="24" rx="3" fill="#fff"/><rect x="6" y="6" width="18" height="6" fill="#e9eef2"/><path d="M9 6 h12 l-2 -4 h-8z" fill="#dfe6ea"/></svg>'
  : '<svg class="b" viewBox="0 0 30 34"><ellipse cx="15" cy="19" rx="11" ry="14" fill="url(#gEgg)" stroke="#f0d49b" stroke-width="1"/><ellipse cx="11" cy="13" rx="3" ry="4" fill="#ffffffaa"/></svg>';}

/* ---------------- sound (WebAudio, no assets) ---------------- */
let AC;function sfx(type){if(muted)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const t=AC.currentTime;
  const o=AC.createOscillator(),g=AC.createGain();o.connect(g);g.connect(AC.destination);
  const map={pop:[660,880],coin:[880,1320],click:[440,520],sell:[523,784,1047],err:[200,160]};
  const f=map[type]||[440];o.type=type==='coin'||type==='sell'?'triangle':'sine';
  o.frequency.setValueAtTime(f[0],t);f.slice(1).forEach((x,i)=>o.frequency.exponentialRampToValueAtTime(x,t+0.06*(i+1)));
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.18,t+0.01);g.gain.exponentialRampToValueAtTime(0.0001,t+0.18);
  o.start(t);o.stop(t+0.2);}catch(e){}}
function toggleMute(){muted=!muted;document.getElementById('mute').textContent=muted?'🔇':'🔊';}
function haptic(k){try{tg?.HapticFeedback?.impactOccurred?.(k||'light')}catch(e){}}

/* ---------------- helpers ---------------- */
function toast(m,e){const t=document.getElementById('toast');t.textContent=m;t.className='toast show'+(e?' err':'');clearTimeout(t._t);t._t=setTimeout(()=>t.className='toast',1600);if(e)sfx('err');}
function fmt(n){return Number(n).toLocaleString(undefined,{maximumFractionDigits:2});}
async function api(p,b){const r=await fetch(p+Q,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(b||{})});const j=await r.json();if(!r.ok||j.error)throw new Error(j.error||'error');return j;}
async function getJSON(u){const r=await fetch(u+(u.includes('?')?'&':'?')+Q.slice(1));return r.json();}
function particles(x,y,emoji,n){const fx=document.getElementById('fx');for(let i=0;i<(n||6);i++){const s=document.createElement('span');s.className='part';s.textContent=emoji;s.style.left=x+'px';s.style.top=y+'px';const a=Math.random()*6.28;s.style.setProperty('--dx',Math.cos(a)*(30+Math.random()*30)+'px');s.style.setProperty('--dy',(-30-Math.random()*40)+'px');fx.appendChild(s);setTimeout(()=>s.remove(),920);}}
function floatText(x,y,txt,color){const fx=document.getElementById('fx');const s=document.createElement('div');s.className='flt';s.textContent=txt;s.style.left=x+'px';s.style.top=y+'px';s.style.color=color||'#ffd84a';fx.appendChild(s);setTimeout(()=>s.remove(),1100);}
function animateNum(el,to){const from=displayBal;displayBal=to;el.textContent=fmt(to);/*robust fallback*/ if(Math.abs(to-from)<0.5)return;const t0=performance.now();function step(t){const k=Math.min(1,(t-t0)/450);el.textContent=fmt(from+(to-from)*(1-Math.pow(1-k,3)));if(k<1)requestAnimationFrame(step);else el.textContent=fmt(to);}requestAnimationFrame(step);}

/* ---------------- level / networth ---------------- */
function priceOf(sym){const i=MKT.list.find(x=>x.sym===sym);return i?i.last:0;}
function netWorth(s){let nw=s.balanceCLK||0;const counts={};for(const a of s.animals)if(a.alive)counts[a.species]=(counts[a.species]||0)+1;for(const k in counts)nw+=counts[k]*priceOf(k);for(const inv of s.inventory)nw+=inv.qty*priceOf(inv.good);return nw;}
function levelInfo(nw){let lvl=1,need=500,acc=0;while(nw>=acc+need){acc+=need;lvl++;need=Math.round(need*1.6);}return{lvl,pct:Math.max(4,Math.min(100,(nw-acc)/need*100))};}

/* ---------------- HUD / wallet ---------------- */
function renderHUD(s){
  animateNum(document.getElementById('bal'),s.balanceCLK);
  const nw=netWorth(s),li=levelInfo(nw);
  document.getElementById('lvl').textContent=li.lvl;
  document.getElementById('xpbar').style.width=li.pct+'%';
  document.getElementById('invrow').innerHTML=s.inventory.map(i=>`<div class="invchip">${i.good==='MILK'?'🥛':'🥚'} ${i.name} <b>${i.qty}</b></div>`).join('')
    +`<div class="invchip">🐾 Animals <b>${s.animals.filter(a=>a.alive).length}</b></div>`;
}

/* ---------------- FARM scene ---------------- */
function syncAnimals(){
  const scene=document.getElementById('animals');const live=FARM.animals.filter(a=>a.alive);const ids=new Set(live.map(a=>a.id));
  for(const [id,el] of els){if(!ids.has(id)){el.style.opacity=0;el.style.transform+=' scale(.3)';setTimeout(()=>el.remove(),300);els.delete(id);}}
  for(const a of live){
    let el=els.get(a.id);
    if(!el){el=document.createElement('div');el.className='an';el.innerHTML=`<div class="flip"></div>`;
      const r=scene.getBoundingClientRect();const x=20+Math.random()*(r.width-90),y=r.height*0.42+Math.random()*(r.height*0.46);
      el._x=x;el._y=y;el.style.transform=`translate(${x}px,${y}px)`;el.style.zIndex=Math.round(y);
      el.dataset.stage='';scene.appendChild(el);els.set(a.id,el);
      el.onclick=ev=>{ev.stopPropagation();doFeed(a.id,el);};
      setTimeout(()=>wander(el),300+Math.random()*1500);
    }
    // sprite (re-render if stage changed)
    if(el.dataset.stage!==a.stage){el.dataset.stage=a.stage;el.querySelector('.flip').innerHTML=spriteFor(a.species,a.stage);el.querySelector('.an .spr,.spr');}
    // egg / hungry badges
    let egg=el.querySelector('.egg');
    if(a.eggsReady>0){if(!egg){egg=document.createElement('div');egg.className='egg';egg.onclick=ev=>{ev.stopPropagation();doCollect(el);};el.appendChild(egg);}
      egg.innerHTML=eggSVG(a.produce==='MILK')+`<span class="cnt">${a.eggsReady}</span>`;}
    else if(egg)egg.remove();
    let hung=el.querySelector('.hungry');
    if(a.fullness<25&&!(a.eggsReady>0)){if(!hung){hung=document.createElement('div');hung.className='hungry';hung.textContent='🌾';el.appendChild(hung);}}
    else if(hung)hung.remove();
  }
}
function wander(el){
  if(!el.isConnected)return;const scene=document.getElementById('animals').getBoundingClientRect();
  const x=18+Math.random()*(scene.width-86),y=scene.height*0.40+Math.random()*(scene.height*0.48);
  const dur=2200+Math.random()*2800;el.classList.add('walking');
  el.querySelector('.flip').style.transform=`scaleX(${x<el._x?-1:1})`;
  el.style.transition=`transform ${dur}ms ease-in-out`;el.style.transform=`translate(${x}px,${y}px)`;el.style.zIndex=Math.round(y);
  el._x=x;el._y=y;clearTimeout(el._t);
  el._t=setTimeout(()=>{el.classList.remove('walking');el._p=setTimeout(()=>wander(el),500+Math.random()*2600);},dur);
}
function elPos(el){const a=document.getElementById('scene').getBoundingClientRect(),e=el.getBoundingClientRect();return{x:e.left-a.left+e.width/2,y:e.top-a.top+e.height/2};}
async function doFeed(id,el){try{const j=await api('/api/feed',{id});const p=elPos(el);particles(p.x,p.y-10,'❤️',4);sfx('pop');haptic('light');applyState(j.state);}catch(e){toast(e.message,true);}}
async function doCollect(el){try{const j=await api('/api/collect-all',{});const p=elPos(el);particles(p.x,p.y-16,'✨',8);floatText(p.x,p.y-24,j.msg.replace('Collected ',''),'#ffd84a');sfx('coin');haptic('medium');applyState(j.state);}catch(e){toast(e.message,true);}}
document.getElementById('feedAll').onclick=async()=>{try{const j=await api('/api/feed-all',{});toast(j.msg+' 🌾');sfx('pop');applyState(j.state);}catch(e){toast(e.message,true);}};
document.getElementById('collectAll').onclick=async()=>{try{const j=await api('/api/collect-all',{});const r=document.getElementById('scene').getBoundingClientRect();for(let i=0;i<10;i++)setTimeout(()=>particles(r.width*(.2+Math.random()*.6),r.height*(.4+Math.random()*.4),'✨',3),i*40);toast(j.msg);sfx('sell');haptic('medium');applyState(j.state);}catch(e){toast(e.message,true);}};
document.getElementById('scene').addEventListener('click',()=>{if(!AC)sfx('click');});

/* ---------------- MARKET ---------------- */
function sparkPath(arr,w,h){if(!arr||arr.length<2)return'';const lo=Math.min(...arr),hi=Math.max(...arr),r=(hi-lo)||1;return arr.map((v,i)=>`${i?'L':'M'}${(i/(arr.length-1)*w).toFixed(1)} ${(h-((v-lo)/r)*h).toFixed(1)}`).join(' ');}
function renderTicks(){
  document.getElementById('ticks').innerHTML=MKT.list.map(i=>{const up=i.changePct>=0;
    return `<div class="tk ${i.sym===SEL?'on':''}" onclick="selectSym('${i.sym}')">
      <div class="top"><div class="sp" style="width:26px;height:26px">${spriteFor(i.sym,'')}</div><div class="sym">${i.sym}</div></div>
      <div class="px num">${fmt(i.last)}</div><div class="chg ${up?'up':'down'}">${up?'▲':'▼'} ${Math.abs(i.changePct).toFixed(2)}%</div>
      <svg class="spark" viewBox="0 0 54 24" preserveAspectRatio="none"><path d="${sparkPath(i.spark,54,24)}" fill="none" stroke="${up?'#33e08a':'#ff6357'}" stroke-width="2" stroke-linejoin="round"/></svg>
    </div>`;}).join('');
}
function selectSym(s){SEL=s;document.querySelectorAll('.tk').forEach(t=>t.classList.remove('on'));renderTicks();pollMarket();sfx('click');}
function renderChart(){
  const c=DET?.candles||[];const svg=document.getElementById('chart');const W=320,H=172;
  if(c.length<2){svg.innerHTML=`<text x="160" y="86" fill="#3a5145" font-size="12" text-anchor="middle">warming up…</text>`;return;}
  const cl=c.map(x=>x.c),lo=Math.min(...c.map(x=>x.l)),hi=Math.max(...c.map(x=>x.h)),r=(hi-lo)||1,pad=10;
  const X=i=>i/(cl.length-1)*(W-8)+4,Yv=v=>pad+(H-2*pad)*(1-(v-lo)/r);
  let line='',area='';cl.forEach((v,i)=>{const x=X(i).toFixed(1),y=Yv(v).toFixed(1);line+=`${i?'L':'M'}${x} ${y} `;area+=`${i?'L':'M'}${x} ${y} `;});
  area=`M${X(0).toFixed(1)} ${H} `+area.replace('M','L')+`L${X(cl.length-1).toFixed(1)} ${H} Z`;
  const up=cl[cl.length-1]>=cl[0];const col=up?'#33e08a':'#ff6357';
  let grid='';for(let k=0;k<=3;k++){const y=pad+(H-2*pad)*k/3;grid+=`<line x1="0" y1="${y}" x2="${W}" y2="${y}" stroke="#17231a" stroke-width="1"/>`;}
  const lx=X(cl.length-1),ly=Yv(cl[cl.length-1]);
  svg.innerHTML=`${grid}
    <path d="${area}" fill="${up?'url(#gChart)':'#ff635722'}"/>
    <path d="${line}" fill="none" stroke="${col}" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
    <line x1="0" y1="${ly}" x2="${W}" y2="${ly}" stroke="${col}55" stroke-dasharray="3 4" stroke-width="1"/>
    <circle cx="${lx}" cy="${ly}" r="4.5" fill="${col}"><animate attributeName="r" values="4.5;7;4.5" dur="1.4s" repeatCount="indefinite"/></circle>
    <text x="4" y="12" fill="#7d9586" font-size="9">${fmt(hi)}</text><text x="4" y="${H-4}" fill="#7d9586" font-size="9">${fmt(lo)}</text>`;
}
function renderBook(){const b=DET.book;let h='';
  h+=b.asks.slice().reverse().map(a=>`<div class="row ask"><div class="d" style="width:${Math.min(100,a.qty*3)}%"></div><span class="px">${fmt(a.price)}</span><span class="q">${a.qty}</span></div>`).join('');
  h+=`<div class="mid ${DET.changePct>=0?'up':'down'}">${fmt(DET.last)} ${DET.changePct>=0?'▲':'▼'}</div>`;
  h+=b.bids.map(x=>`<div class="row bid"><div class="d" style="width:${Math.min(100,x.qty*3)}%"></div><span class="px">${fmt(x.price)}</span><span class="q">${x.qty}</span></div>`).join('');
  document.getElementById('book').innerHTML=h;}
function renderTicket(){
  document.getElementById('cNm').innerHTML=`<span class="sp" style="width:30px;height:30px">${spriteFor(DET.sym,'')}</span> ${DET.name}`;
  const up=DET.changePct>=0;document.getElementById('cPr').textContent=fmt(DET.last);
  const chg=document.getElementById('cChg');chg.textContent=(up?'+':'')+DET.changePct.toFixed(2)+'%';chg.className='pill '+(up?'u':'d');
  const p=DET.position;document.getElementById('pos').innerHTML=`<span>Holding <b>${p.qty}</b> @ ${fmt(p.avg)}</span><span class="${p.pnl>=0?'up':'down'}">P&L <b>${p.pnl>=0?'+':''}${fmt(p.pnl)}</b></span>`;
  document.getElementById('openord').innerHTML=DET.orders.map(o=>`<div class="o"><span class="${o.side==='buy'?'up':'down'}">${o.side.toUpperCase()} ${o.qty} @ ${fmt(o.price)}</span><button onclick="cancelOrder('${o.id}')">cancel</button></div>`).join('');
  document.getElementById('tape').innerHTML=DET.tape.map(t=>`<div class="t"><span class="${t.side==='buy'?'up':'down'}">${t.side==='buy'?'▲':'▼'} ${fmt(t.price)}</span><span style="color:var(--dim)">×${t.qty}</span></div>`).join('');
  updateEst();
}
function renderNews(){const txt=(NEWS||[]).map(n=>`${n.text} (${n.sym})`).join('     •     ')||'Market is calm — no news.';document.getElementById('newsScroll').textContent=txt+'     •     '+txt;}
function setOType(t){OTYPE=t;document.getElementById('segM').classList.toggle('on',t==='market');document.getElementById('segL').classList.toggle('on',t==='limit');document.getElementById('priceRow').style.display=t==='limit'?'block':'none';updateEst();}
function bump(d){const q=document.getElementById('qty');q.value=Math.max(1,(+q.value||1)+d);updateEst();sfx('click');}
function updateEst(){if(!DET)return;const qty=+document.getElementById('qty').value||0;const px=OTYPE==='limit'?(+document.getElementById('price').value||DET.last):DET.last;const notional=qty*px,fee=notional*DET.feeBps/10000;document.getElementById('est').innerHTML=`${qty} ${DET.sym} ≈ <b>${fmt(notional)}</b> + fee ${fmt(fee)}`;}
document.getElementById('qty').addEventListener('input',updateEst);
document.getElementById('price').addEventListener('input',updateEst);
async function order(side){if(busy)return;busy=true;const qty=+document.getElementById('qty').value||0,price=+document.getElementById('price').value||0;
  try{const j=await api('/api/order',{symbol:SEL,side,type:OTYPE,qty,price});toast(j.msg);DET=j.detail;applyState(j.state);renderChart();renderBook();renderTicket();
    sfx(side==='buy'?'coin':'sell');haptic('medium');}catch(e){toast(e.message,true);}busy=false;}
async function cancelOrder(id){try{await api('/api/cancel',{id});pollMarket();sfx('click');}catch(e){toast(e.message,true);}}

/* ---------------- tabs / polling ---------------- */
function setTab(t){TAB=t;document.getElementById('vFarm').classList.toggle('on',t==='farm');document.getElementById('vMarket').classList.toggle('on',t==='market');
  document.getElementById('navFarm').classList.toggle('on',t==='farm');document.getElementById('navMkt').classList.toggle('on',t==='market');sfx('click');poll();}
function applyState(s){FARM=s;renderHUD(s);if(TAB==='farm')syncAnimals();}
async function pollFarm(){try{applyState(await getJSON('/api/state'));}catch(e){}}
async function pollMarket(){try{const m=await getJSON('/api/market');MKT=m;NEWS=m.news;renderTicks();renderNews();
  const d=await getJSON('/api/market?symbol='+SEL);DET=d.detail;NEWS=d.news;renderNews();renderChart();renderBook();renderTicket();
  applyState(await getJSON('/api/state'));}catch(e){}}
async function poll(){if(TAB==='farm')await pollFarm();else await pollMarket();}
window.addEventListener('resize',()=>{});
// boot
(async()=>{try{const m=await getJSON('/api/market');MKT=m;NEWS=m.news;}catch(e){}
  if(!localStorage.getItem('chx_seen')){document.getElementById('coach').style.display='flex';}
  poll();setInterval(poll,1300);})();
function closeCoach(){localStorage.setItem('chx_seen','1');document.getElementById('coach').style.display='none';sfx('coin');}
